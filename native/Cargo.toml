[package]
name = "spiritbyte-mobile"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
spiritbyte-core = { path = "../core" }
uniffi = "=0.29.4"
serde_json = "1"
thiserror = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
